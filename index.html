<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeLirik - Spotify Lyrics</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🎵 MeLirik 🎵</h1>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Ketik judul lagu, artist, atau paste link di sini ...">
            <button id="searchBtn" onclick="processSpotifyLink()">Cari</button>
        </div>
    </header>

    <main id="player-section" class="hidden">
        <div class="track-info">
            <img id="album-art" src="" alt="Album Art">
            <div>
                <h2 id="track-title">Judul Lagu</h2>
                <h3 id="track-artist">Nama Artis</h3>
                <p id="status-text" style="color: #1DB954; font-size: 14px; margin-top: 5px;"></p>
            </div>
        </div>

        <div class="lyrics-container" id="lyrics-container">
            </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
