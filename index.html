<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeLirik - Spotify Lyrics</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🎵 MeLirik 🎵</h1>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Ketik judul lagu, artist, atau paste link di sini ...">
            <button id="searchBtn" onclick="processSpotifyLink()">Cari</button>
        </div>
    </header>

    <main id="player-section" class="hidden">
        <div class="track-info">
            <img id="album-art" src="" alt="Album Art">
            <div>
                <h2 id="track-title">Judul Lagu</h2>
                <h3 id="track-artist">Nama Artis</h3>
                <p id="status-text" style="color: #1DB954; font-size: 14px; margin-top: 5px;"></p>
            </div>
        </div>

        <div class="lyrics-container" id="lyrics-container">
        </div>
    </main>

    <!-- FOOTER CREDIT-->
    <div class="footer-credit">
        <span>Dibuat oleh <strong>Muhammad Abyan Thorif</strong></span> 
        
        <a href="https://instagram.com/mabyanthorif" target="_blank" class="ig-link">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="ig-icon">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
            @mabyanthorif
        </a>
    </div>

    <script src="script.js"></script>
</body>
</html>
